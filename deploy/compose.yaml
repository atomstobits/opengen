name: opengen

# Only these provider variables enter the gateway/worker. The web receives none.
# Add any additional regional key here deliberately; never mount the whole .env.
# Nonsecret server control. Dedicated payment sandboxes set false for API and worker.
x-provider-env: &provider-env
  OPENGEN_PROVIDER_EXECUTION_ENABLED: ${OPENGEN_PROVIDER_EXECUTION_ENABLED-true}
  OPENGEN_EXECUTION_SCOPE: ${OPENGEN_EXECUTION_SCOPE-unrestricted}
  # A bare key remains unset when no reviewed fixture pin is supplied.
  OPENGEN_QUALIFICATION_FIRST_FRAME_SHA256:
  ALIBABA_REGION: ${ALIBABA_REGION:-ap-southeast-1}
  DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
  ALIBABA_WORKSPACE_ID: ${ALIBABA_WORKSPACE_ID:-}
  ALIBABA_AP_SOUTHEAST_1_API_KEY: ${ALIBABA_AP_SOUTHEAST_1_API_KEY:-}
  ALIBABA_AP_SOUTHEAST_1_WORKSPACE_ID: ${ALIBABA_AP_SOUTHEAST_1_WORKSPACE_ID:-}
  ALIBABA_CN_BEIJING_API_KEY: ${ALIBABA_CN_BEIJING_API_KEY:-}
  ALIBABA_CN_BEIJING_WORKSPACE_ID: ${ALIBABA_CN_BEIJING_WORKSPACE_ID:-}
  ALIBABA_AP_NORTHEAST_1_API_KEY: ${ALIBABA_AP_NORTHEAST_1_API_KEY:-}
  ALIBABA_AP_NORTHEAST_1_WORKSPACE_ID: ${ALIBABA_AP_NORTHEAST_1_WORKSPACE_ID:-}
  ALIBABA_EU_CENTRAL_1_API_KEY: ${ALIBABA_EU_CENTRAL_1_API_KEY:-}
  ALIBABA_EU_CENTRAL_1_WORKSPACE_ID: ${ALIBABA_EU_CENTRAL_1_WORKSPACE_ID:-}
  ALIBABA_US_EAST_1_API_KEY: ${ALIBABA_US_EAST_1_API_KEY:-}
  ALIBABA_US_EAST_1_WORKSPACE_ID: ${ALIBABA_US_EAST_1_WORKSPACE_ID:-}
  ALIBABA_CN_HONGKONG_API_KEY: ${ALIBABA_CN_HONGKONG_API_KEY:-}
  ALIBABA_CN_HONGKONG_WORKSPACE_ID: ${ALIBABA_CN_HONGKONG_WORKSPACE_ID:-}
  BYTEPLUS_API_KEY: ${BYTEPLUS_API_KEY:-}
  FAL_KEY: ${FAL_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  XAI_API_KEY: ${XAI_API_KEY:-}
  MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
  RUNWAYML_API_SECRET: ${RUNWAYML_API_SECRET:-}
  PIKA_API_KEY: ${PIKA_API_KEY:-}
  FAL_END_USER_ID: ${FAL_END_USER_ID:-}
  MR_VAULT_KEY: ${MR_VAULT_KEY:?Run npm run setup:local first}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  # Private server lifecycle/operational relay config. Blank retention means no automatic expiry.
  # The engine validates configured retention as safe integer milliseconds >=60000.
  MR_INPUT_RETENTION_MS: ${MR_INPUT_RETENTION_MS:-}
  OPENGEN_NOTIFICATION_EMAIL_ENDPOINT: ${OPENGEN_NOTIFICATION_EMAIL_ENDPOINT:-}
  OPENGEN_NOTIFICATION_EMAIL_IDEMPOTENCY_CONFIRMED: ${OPENGEN_NOTIFICATION_EMAIL_IDEMPOTENCY_CONFIRMED:-0}
  OPENGEN_NOTIFICATION_EMAIL_AUTH_TOKEN: ${OPENGEN_NOTIFICATION_EMAIL_AUTH_TOKEN:-}

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: opengen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:local first}
      POSTGRES_DB: opengen
    volumes: ['database:/var/lib/postgresql/data']
    ports: ['127.0.0.1:5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opengen -d opengen']
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    image: opengen-server:local
    build: { context: .., target: server }
    restart: unless-stopped
    init: true
    environment:
      <<: *provider-env
      HOST: 0.0.0.0
      PORT: 4310
      DATABASE_URL: postgresql://opengen:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/opengen
      MR_API_TOKEN: ${MR_API_TOKEN:?Run npm run setup:local first}
      MR_SESSION_SECRET: ${MR_SESSION_SECRET:?Run npm run setup:local first}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_LIVEMODE: ${STRIPE_LIVEMODE:-false}
      # Scoped billing is API-only and stays disabled until explicitly configured.
      OPENGEN_BILLING_MANUAL: ${OPENGEN_BILLING_MANUAL:-false}
      OPENGEN_BILLING_SANDBOX: ${OPENGEN_BILLING_SANDBOX:-false}
      OPENGEN_BILLING_CHECKOUT: ${OPENGEN_BILLING_CHECKOUT:-paused}
      OPENGEN_BILLING_PROCESSOR_ENVIRONMENT: ${OPENGEN_BILLING_PROCESSOR_ENVIRONMENT:-}
      OPENGEN_BILLING_PROCESSOR_ACCOUNT: ${OPENGEN_BILLING_PROCESSOR_ACCOUNT:-}
      OPENGEN_BILLING_MANUAL_WORKSPACE: ${OPENGEN_BILLING_MANUAL_WORKSPACE:-}
      OPENGEN_BILLING_SANDBOX_WORKSPACE: ${OPENGEN_BILLING_SANDBOX_WORKSPACE:-}
      OPENGEN_BILLING_APPROVAL_REFERENCE: ${OPENGEN_BILLING_APPROVAL_REFERENCE:-}
      OPENGEN_BILLING_TERMS_VERSION: ${OPENGEN_BILLING_TERMS_VERSION:-}
      OPENGEN_BILLING_TERMS_TEXT: ${OPENGEN_BILLING_TERMS_TEXT:-}
      OPENGEN_BILLING_OPERATOR_BEARER: ${OPENGEN_BILLING_OPERATOR_BEARER:-}
      OPENGEN_PUBLIC_URL: ${OPENGEN_PUBLIC_URL:-http://127.0.0.1:4320}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-}
      OIDC_API_AUDIENCE: ${OIDC_API_AUDIENCE:-}
      OIDC_ALLOWED_SCOPES: ${OIDC_ALLOWED_SCOPES:-read generate}
      MR_WORKSPACE_ID: ${MR_WORKSPACE_ID:-local}
      MR_INITIAL_BALANCE_MICROS: ${MR_INITIAL_BALANCE_MICROS:-0}
      METRICS_ORIGIN_REGION: ${METRICS_ORIGIN_REGION:-local}
    ports: ['127.0.0.1:4310:4310']
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4310/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  worker:
    image: opengen-server:local
    build: { context: .., target: server }
    command: ['npm', 'run', 'worker']
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    environment:
      <<: *provider-env
      DATABASE_URL: postgresql://opengen:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/opengen
      OPENGEN_PUBLIC_URL: ${OPENGEN_PUBLIC_URL:-http://127.0.0.1:4320}
      METRICS_ORIGIN_REGION: ${METRICS_ORIGIN_REGION:-local}
      C2PA_TOOL_PATH: ${C2PA_TOOL_PATH:-}
      C2PA_TOOL_NETWORK_ISOLATED: ${C2PA_TOOL_NETWORK_ISOLATED:-false}
      C2PA_TRUST_ANCHORS_PATH: ${C2PA_TRUST_ANCHORS_PATH:-}
      C2PA_TSA_TRUST_ANCHORS_PATH: ${C2PA_TSA_TRUST_ANCHORS_PATH:-}
    depends_on:
      api: { condition: service_healthy }
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  web:
    image: opengen-web:local
    build: { context: .., target: web }
    restart: unless-stopped
    init: true
    environment:
      MEDIA_ROUTER_API_URL: http://api:4310
      OPENGEN_PUBLIC_URL: ${OPENGEN_PUBLIC_URL:-http://127.0.0.1:4320}
      NEXT_TELEMETRY_DISABLED: 1
      OPENGEN_HERO_VIDEO_URL: ${OPENGEN_HERO_VIDEO_URL:-}
      OPENGEN_HERO_POSTER_URL: ${OPENGEN_HERO_POSTER_URL:-}
    ports: ['127.0.0.1:4320:4320']
    depends_on:
      api: { condition: service_healthy }
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  database:
