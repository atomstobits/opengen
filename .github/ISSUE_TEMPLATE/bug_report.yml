name: Bug report
description: Report a reproducible non-sensitive failure
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: 'Do not attach tokens, .env, private prompts, signed asset URLs or raw provider responses. Report security issues privately using SECURITY.md.'
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the OpenGen version/commit and relevant interface.
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use synthetic public input and sanitized IDs only.
    validations: { required: true }
  - type: textarea
    id: environment
    attributes:
      label: Environment and redacted evidence
      description: Browser/OS, self-hosted or managed, exact model/deployment when relevant. No credentials.
