name: Isolated C2PA integration
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Verify real C2PA reports with network-isolated containers
        run: node --import tsx scripts/provenance-smoke.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROVENANCE_SMOKE_REPORT: ${{ runner.temp }}/opengen-provenance-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: isolated-c2pa-report
          path: ${{ runner.temp }}/opengen-provenance-report.json
          if-no-files-found: ignore
          retention-days: 7
