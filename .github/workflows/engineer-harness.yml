name: Engineer Harness

# SECURITY: This workflow runs with write-scoped tokens and checks out only
# default-branch code (`persist-credentials: false`). Never check out or execute
# PR-head code here.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to synchronize
        required: true
        type: number
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, dequeued]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ['Checks', 'Engineer Harness Fork Review']
    types: [completed]

permissions:
  actions: read
  checks: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  sync:
    if: >-
      ${{
        (
          github.event_name != 'pull_request_target' ||
          github.event.action != 'edited' ||
          github.event.changes.base != null
        ) &&
        (
          github.event_name != 'workflow_run' ||
          (github.event.workflow_run.name == 'Checks' && github.event.workflow_run.event == 'pull_request') ||
          (
            github.event.workflow_run.name == 'Engineer Harness Fork Review' &&
            (github.event.workflow_run.event == 'pull_request_review' || github.event.workflow_run.event == 'pull_request_review_comment') &&
            github.event.workflow_run.conclusion == 'success'
          )
        ) &&
        (
          github.event_name != 'issue_comment' ||
          (
            github.event.issue.pull_request != null &&
            (
              github.event.comment.user.login == (vars.CODEX_REVIEW_ACTOR || 'chatgpt-codex-connector') ||
              github.event.comment.user.login == format('{0}[bot]', vars.CODEX_REVIEW_ACTOR || 'chatgpt-codex-connector') ||
              contains(github.event.comment.body, '@codex') ||
              contains(github.event.comment.body, 'codex-auto-review') ||
              contains(github.event.comment.body, '/harness-requeue')
            )
          )
        ) &&
        (
          github.event_name != 'pull_request_review' ||
          (
            github.event.pull_request.head.repo.full_name == github.repository &&
            (
              github.event.review.user.login == (vars.CODEX_REVIEW_ACTOR || 'chatgpt-codex-connector') ||
              github.event.review.user.login == format('{0}[bot]', vars.CODEX_REVIEW_ACTOR || 'chatgpt-codex-connector') ||
              github.event.review.state == 'approved' ||
              github.event.review.state == 'changes_requested'
            )
          )
        ) &&
        (
          github.event_name != 'pull_request_review_comment' ||
          (
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.comment.user.login != (vars.CODEX_REVIEW_ACTOR || 'chatgpt-codex-connector') &&
            github.event.comment.user.login != format('{0}[bot]', vars.CODEX_REVIEW_ACTOR || 'chatgpt-codex-connector')
          )
        )
      }}
    concurrency:
      group: engineer-harness-${{ inputs.pr_number || github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha || github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Resolve target pull request
        id: pr
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              const pullRequestNumber = Number(context.payload.inputs?.pr_number);
              if (!Number.isSafeInteger(pullRequestNumber) || pullRequestNumber <= 0) {
                core.setFailed('A positive pull request number is required.');
                return;
              }
              core.setOutput('number', String(pullRequestNumber));
              return;
            }

            if (
              context.eventName === 'pull_request_target' ||
              context.eventName === 'pull_request_review' ||
              context.eventName === 'pull_request_review_comment'
            ) {
              core.setOutput('number', String(context.payload.pull_request.number));
              return;
            }

            if (context.eventName === 'issue_comment') {
              core.setOutput('number', String(context.payload.issue.number));
              return;
            }

            const workflowRun = context.payload.workflow_run;
            const directPullRequests = workflowRun?.pull_requests ?? [];
            if (directPullRequests.length > 0 && directPullRequests[0]?.number) {
              core.setOutput('number', String(directPullRequests[0].number));
              return;
            }

            const { owner, repo } = context.repo;
            const headOwner = workflowRun?.head_repository?.owner?.login ?? '';
            const headBranch = workflowRun?.head_branch ?? '';
            const headSha = workflowRun?.head_sha ?? '';

            if (headOwner && headBranch) {
              const { data: branchPulls } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${headOwner}:${headBranch}`,
                per_page: 20,
              });
              const matchingBranchPr =
                branchPulls.find((pr) => pr.head?.sha === headSha) ?? branchPulls[0];
              if (matchingBranchPr !== undefined) {
                core.setOutput('number', String(matchingBranchPr.number));
                return;
              }
            }

            if (headSha) {
              const { data: commitPulls } =
                await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner,
                  repo,
                  commit_sha: headSha,
                });
              const matchingCommitPr =
                commitPulls.find((pr) => pr.state === 'open') ?? commitPulls[0];
              if (matchingCommitPr !== undefined) {
                core.setOutput('number', String(matchingCommitPr.number));
                return;
              }
            }

            core.info('No associated pull request found for this workflow_run event; skipping.');
            core.setOutput('number', '');

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - if: ${{ steps.pr.outputs.number != '' }}
        run: npm ci

      - name: Synchronize engineer harness state
        id: harness_sync
        if: ${{ steps.pr.outputs.number != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          CODEX_REVIEW_ACTOR: ${{ vars.CODEX_REVIEW_ACTOR != '' && vars.CODEX_REVIEW_ACTOR || 'chatgpt-codex-connector' }}
          ENGINEER_HARNESS_MAX_ROUNDS: ${{ vars.ENGINEER_HARNESS_MAX_ROUNDS != '' && vars.ENGINEER_HARNESS_MAX_ROUNDS || '5' }}
          ENGINEER_HARNESS_MERGE_POLICY: ${{ vars.ENGINEER_HARNESS_MERGE_POLICY != '' && vars.ENGINEER_HARNESS_MERGE_POLICY || 'auto-merge' }}
        run: |
          set -euo pipefail
          output="$(node --import tsx scripts/engineer-harness/src/cli.ts sync)"
          printf '%s\n' "$output"
          status="$(printf '%s\n' "$output" | tail -n 1)"
          echo "status=${status}" >> "$GITHUB_OUTPUT"

      - name: Enqueue pull request when merge policy is satisfied
        if: ${{ steps.harness_sync.outputs.status == 'ready-merge' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ENGINEER_HARNESS_QUEUE_TOKEN: ${{ secrets.ENGINEER_HARNESS_QUEUE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          CODEX_REVIEW_ACTOR: ${{ vars.CODEX_REVIEW_ACTOR != '' && vars.CODEX_REVIEW_ACTOR || 'chatgpt-codex-connector' }}
          ENGINEER_HARNESS_MAX_ROUNDS: ${{ vars.ENGINEER_HARNESS_MAX_ROUNDS != '' && vars.ENGINEER_HARNESS_MAX_ROUNDS || '5' }}
          ENGINEER_HARNESS_MERGE_POLICY: ${{ vars.ENGINEER_HARNESS_MERGE_POLICY != '' && vars.ENGINEER_HARNESS_MERGE_POLICY || 'auto-merge' }}
        run: node --import tsx scripts/engineer-harness/src/cli.ts merge
